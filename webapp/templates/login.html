<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LLM Prompt Injection Scanner</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container" style="max-width:400px">

  <h1>🔍 LLM Prompt Injection Scanner</h1>
  <div class="subtitle">This deployment requires a password.</div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card">
    <form method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus
        style="width:100%;font-size:14px;padding:10px 14px;border-radius:6px;
        border:1px solid #2a2a2a;background:#111;color:#e5e5e5;margin-bottom:12px">
      <button type="submit" style="width:100%;margin-left:0">Log in</button>
    </form>
  </div>

</div>
</body>
</html>
