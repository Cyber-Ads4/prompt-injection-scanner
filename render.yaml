services:
  - type: web
    name: prompt-injection-scanner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 webapp.app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
